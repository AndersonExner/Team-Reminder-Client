name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use vMAJOR.MINOR.PATCH.' }
          "APP_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Test client contracts
        run: dotnet test tests/TeamReminder.Core.Tests -c Release
      - name: Test local storage
        run: dotnet test tests/TeamReminder.Local.Tests -c Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version $env:APP_VERSION
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = "artifacts/installer/TeamReminder-Setup-$env:APP_VERSION-x64.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Instalador ausente.' }
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$installer.sha256", "$sha256  TeamReminder-Setup-$env:APP_VERSION-x64.exe")
          $manifest = @{
            tag_name = $env:RELEASE_TAG
            published_at = [DateTimeOffset]::UtcNow.ToString("o")
            draft = $false
            prerelease = $false
            assets = @(@{
              name = "TeamReminder-Setup-$env:APP_VERSION-x64.exe"
              browser_download_url = "https://github.com/AndersonExner/Team-Reminder-Client/releases/download/$env:RELEASE_TAG/TeamReminder-Setup-$env:APP_VERSION-x64.exe"
              sha256 = $sha256
            })
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("release.json", $manifest)
          gh release create "$env:RELEASE_TAG" "$installer" "$installer.sha256" release.json --verify-tag --title "Team Reminder $env:APP_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }

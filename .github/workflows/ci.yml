name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core
        run: dotnet test tests/TeamReminder.Core.Tests -c Release
      - name: Test local storage
        run: dotnet test tests/TeamReminder.Local.Tests -c Release
